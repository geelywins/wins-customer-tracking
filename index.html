/* ---------- pembatalan & refund (pembeli) ---------- */
const REFUND_BANKS = ['BCA','BRI','BNI','Mandiri','BSI','CIMB Niaga','Permata','Danamon','SeaBank','Bank Jago','Jenius (BTPN)','Dana','GoPay','OVO','ShopeePay','Lainnya'];
const REFUND_REASONS_CANCEL = ['Berubah pikiran','Salah memesan produk atau jumlah','Alamat atau jadwal tidak sesuai','Menemukan harga lain','Lainnya'];
const REFUND_REASONS_DEFECT = ['Barang cacat atau rusak','Barang tidak berfungsi','Barang tidak sesuai pesanan','Barang kurang atau tidak lengkap','Lainnya'];
function orderPaid(o){ return !!(o.payment && o.payment.method!=='cash' && (o.proof || ['dibayar','diproses','dikirim','selesai'].includes(o.status))); }
function deliveredAt(o){
  const h = o.history ? Object.values(o.history) : []; let t = null;
  h.forEach(x=>{ if(x && (x.status==='dikirim' || x.status==='selesai')){ const v = Date.parse(x.at); if(!isNaN(v) && (t===null || v<t)) t = v; } });
  return t;
}
function refundWindow(o){
  const days = Number((CAT.refundPolicy||{}).returnDays) || 7; const t = deliveredAt(o) || Date.parse(o.updatedAt || o.createdAt) || Date.now();
  const left = Math.ceil((t + days*86400000 - Date.now()) / 86400000);
  return { days, left, ok: left >= 0 };
}
function orderActions(o){
  if(!o || o.status==='batal') return {};
  if(o.refund && o.refund.request) return {};
  const st = o.status;
  if(st==='baru' && !o.proof) return { cancel:'direct' };
  if(['baru','dibayar','diproses'].includes(st)) return { cancel:'request', needBank: orderPaid(o) };
  if(['dikirim','selesai'].includes(st)) return { claim:true, win:refundWindow(o) };
  return {};
}
function maskNo(n){ n = String(n||''); return n.length > 4 ? '•••• ' + n.slice(-4) : n; }
function refundStateOf(o){
  const rq = o.refund && o.refund.request, dc = o.refund && o.refund.decision;
  if(!rq) return null;
  const st = dc && dc.status;
  if(!st) return { key:'new', label:'Menunggu review admin', cls:'rf-wait' };
  if(st==='disetujui') return { key:'ok', label:'Disetujui', cls:'rf-ok' };
  if(st==='ditolak') return { key:'no', label:'Ditolak', cls:'rf-no' };
  return { key:'done', label:'Selesai', cls:'rf-ok' };
}
function refundBadgeHtml(o){ const s = refundStateOf(o); return s ? ` <span class="rf-badge ${s.cls}">Refund · ${esc(s.label)}</span>` : ''; }
function refundCardHtml(o){
  const rq = o.refund.request, dc = o.refund.decision || null, s = refundStateOf(o);
  const defect = rq.type==='defect';
  const money = rq.bank ? `<div class="sum-row"><span>Rekening tujuan</span><span style="text-align:right">${esc(rq.bank.name)} · ${esc(maskNo(rq.bank.no))}<br><span style="font-size:12.5px;color:var(--muted)">a.n. ${esc(rq.bank.holder)}</span></span></div>` : '';
  let body = '';
  if(s.key==='new') body = `<p class="rf-msg">Pengajuanmu sudah masuk dan menunggu review admin. Kami akan menghubungi lewat WhatsApp.</p>`;
  if(s.key==='ok') body = `<p class="rf-msg">${defect ? 'Pengajuan disetujui. Ikuti arahan admin untuk mengembalikan barang, lalu dana akan ditransfer ke rekening di atas.' : 'Pembatalan disetujui.'}${rq.bank ? ` Dana ${dc.amount!=null?'<b>'+rp(dc.amount)+'</b> ':''}akan ditransfer ke rekening yang kamu isi.` : ''}</p>`;
  if(s.key==='no') body = `<p class="rf-msg">Pengajuan belum dapat disetujui.</p>`;
  if(s.key==='done') body = `<p class="rf-msg">${rq.bank && dc.amount>0 ? `Dana <b>${rp(dc.amount)}</b> sudah dikembalikan ke rekening kamu${dc.refundedAt?' pada '+new Date(dc.refundedAt).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):''}${dc.ref?'. Referensi: '+esc(dc.ref):''}.` : 'Proses selesai.'}</p>`;
  return `<div class="panel" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0;font-size:16px">${defect?'Refund barang cacat':'Pembatalan pesanan'}</h2><span class="rf-badge ${s.cls}">${esc(s.label)}</span></div>
    ${body}${dc && dc.note ? `<p class="rf-note"><b>Pesan admin:</b> ${esc(dc.note)}</p>` : ''}
    <div class="sum-row"><span>Nominal diajukan</span><b>${rp(rq.amount)}</b></div>
    <div class="sum-row"><span>Alasan</span><span style="text-align:right;max-width:62%">${esc(rq.reason)}${rq.detail?'<br><span style="font-size:12.5px;color:var(--muted)">'+esc(rq.detail)+'</span>':''}</span></div>
    ${defect ? `<div class="sum-row"><span>Bukti</span><span>${Number(rq.evN)>0 ? rq.evN+' foto' : ''}${Number(rq.evN)>0 && rq.videoUrl ? ' + ' : ''}${rq.videoUrl ? 'link video' : ''}</span></div>` : ''}${money}</div>`;
}

  const a = orderActions(o);
  if(o.refund && o.refund.request) return refundCardHtml(o);
  if(o.status==='batal') return o.cancel ? `<div class="panel" style="margin-top:12px"><h2 style="margin:0 0 4px;font-size:16px">Pesanan dibatalkan</h2><p class="rf-msg">Dibatalkan oleh kamu pada ${new Date(o.cancel.at).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}.</p></div>` : '';

      : `<div class="panel" style="margin-top:12px"><h2 style="margin:0 0 4px;font-size:16px">Barang bermasalah?</h2><p class="rf-msg">Masa pengajuan refund (${a.win.days} hari setelah barang dikirim) sudah lewat. Hubungi admin lewat WhatsApp untuk bantuan.</p></div>`;
  }
  return '';
}

    rd.onload = ()=>{ const img = new Image(); img.onerror = ()=>rej(new Error('img'));
      img.onload = ()=>{ let w = 1000, q = 0.7, out = '';
        for(let i=0;i<4;i++){ const s = Math.min(1, w/img.width); const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
          const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height); out = c.toDataURL('image/jpeg', q);
          if(out.length < 380000) break; w = Math.round(w*0.8); q = Math.max(0.5, q-0.08); }
        res(out); };
      img.src = rd.result; };
    rd.readAsDataURL(file);
  });
}

/* Email reset: lewat webhook n8n kalau diisi admin (email bertombol dari Gmail toko).
   Kalau n8n tidak bisa dihubungi / belum aktif, otomatis memakai email bawaan Firebase. */
async function sendResetEmail(email){
  const hook = (CAT && CAT.store && CAT.store.resetHook) || '';
  if(/^https:\/\//.test(hook)){
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 12000);
    try{ const res = await fetch(hook, { method:'POST', body:new URLSearchParams({ email }), signal:ctl.signal }); clearTimeout(t); if(res.ok) return 'n8n'; }
    catch(x){ clearTimeout(t); }
  }
  await auth.sendPasswordResetEmail(email); return 'firebase';
}

  CAT.segments = (CAT.segments && Object.values(CAT.segments).length) ? Object.values(CAT.segments) : [{ key:'otomotif', name:'Otomotif', tagline:(CAT.store||{}).tagline||'' }];
  CAT.categories = CAT.categories || []; CAT.categories.forEach(c=>{ if(!c.segment) c.segment = 'otomotif'; });
  if(CAT.frozen){ const F = CAT.frozen; F.slots = Object.values(F.slots||[]); F.areas = Object.values(F.areas||[]); F.closedWeekdays = Object.values(F.closedWeekdays||[]).map(Number); F.closedDates = Object.values(F.closedDates||[]); F.pay = F.pay || { transfer:true, qris:true }; }
  (CAT.products||[]).forEach(x=>{ x.variants = Object.values(x.variants||[]); });
  CAT.film = CAT.film || { sides:[], packages:{}, brands:[] }; CAT.film.brands = CAT.film.brands||[];
  ['carpets','products','banners','promos','shipping','categories','cars'].forEach(k=>{ CAT[k] = CAT[k]||[]; });
  CAT.payments = CAT.payments||{}; CAT.store = CAT.store||{};
  CAT.film.sizes = CAT.film.sizes || ['Small','Medium','Large','XL'];
  CAT.cars.forEach(c=>{ c.sizes = c.sizes||{}; });
  CAT.film.brands.forEach(b=>{ b.prices = b.prices||{}; b.shades = b.shades||{}; b.images = b.images||[]; });
  /* katalog lama (sebelum ada ukuran): satu harga untuk semua ukuran */
  CAT.film.brands.forEach(b=>{ const keys = Object.keys(b.prices); if(keys.some(k=>!CAT.film.sizes.includes(k))){ const flat = {}; keys.forEach(k=>{ if(!CAT.film.sizes.includes(k)) flat[k] = b.prices[k]; }); b.prices = {}; CAT.film.sizes.forEach(z=>{ b.prices[z] = Object.assign({}, flat); }); } });
  if(!(CAT.v>=3)) CAT.cars.forEach(c=>(c.models||[]).forEach(m=>{ if(!c.sizes[m]) c.sizes[m] = CAT.film.sizes[0]; }));
  CAT.carpets.forEach(c=>{ c.prices = c.prices||{}; c.packages = c.packages||[]; c.colors = c.colors||[]; c.images = c.images||[]; });
  CAT.products.forEach(x=>{ x.variants = x.variants||[]; x.images = x.images||[]; });
  CAT.cars.forEach(c=>{ c.models = c.models||[]; });
  CAT.properties = Object.values(CAT.properties || {}).map(x=>Object.assign({}, x, { images:Object.values(x.images || []), payment:Object.values(x.payment || []), facilities:Object.values(x.facilities || []), nearby:Object.values(x.nearby || []) }));
  if(CAT.property){ const P = CAT.property; P.slots = Object.values(P.slots || []); P.closedWeekdays = Object.values(P.closedWeekdays || []).map(Number); P.closedDates = Object.values(P.closedDates || []); }
  applySeg();
}
async function refreshCatalog(){
  try{
    const c = await api('pos/catalog'); catLoadedAt = Date.now();
    if(!c || (CAT && c.updatedAt===CAT.updatedAt)) return;
    CAT = c; prepCatalog();
    const first = (location.hash.replace(/^#/,'')||'/').split('/').filter(Boolean)[0] || '';
    if(['','c','search','promo','deal','fav','cart'].includes(first)) route();
    toast('Katalog toko diperbarui');
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && CAT && Date.now()-catLoadedAt > 90000) refreshCatalog(); });

/* ---------- reset password lewat link email ----------
   Action URL di Firebase diarahkan ke halaman toko ini. Link email berbentuk
   .../tokoacc/?mode=resetPassword&oobCode=...&apiKey=...  Halaman ini tidak butuh katalog/DB. */
const RESET = (function(){
  try{ const q = new URLSearchParams(location.search);
    if(q.get('mode')==='resetPassword' && q.get('oobCode')){ const r = { code:q.get('oobCode'), apiKey:q.get('apiKey')||'' }; history.replaceState(null, '', location.pathname + '#/reset'); return r; } }catch(e){}
  return null;
})();
function toStore(hash){ location.href = location.pathname + '?s=' + Date.now() + (DB ? '&db=' + encodeURIComponent(DB) : '') + (hash||''); }
async function viewReset(){
  const card = html=>{ app.innerHTML = `<div class="panel auth-card">${html}</div>`; };
  const dead = ()=>{ card(`<h1>Link tidak berlaku</h1><p class="sub">Link reset sudah dipakai, kedaluwarsa (berlaku 1 jam), atau tidak lengkap. Minta link baru untuk melanjutkan.</p><button class="btn block" id="rsNew">Minta link baru</button>`); document.getElementById('rsNew').onclick = ()=>toStore('#/forgot'); };
  if(!RESET || !RESET.code || !auth){ dead(); return; }
  card(`<div class="skel" style="height:26px;width:60%"></div><div class="skel" style="height:46px;margin-top:16px"></div><div class="skel" style="height:46px;margin-top:12px"></div>`);
  let email = '';
  try{ email = await auth.verifyPasswordResetCode(RESET.code); }catch(x){ dead(); return; }
  card(`<h1>Buat password baru</h1><p class="sub">Untuk akun <b>${esc(email)}</b></p>
    ${pwField('np','Password baru','new-password')}${pwField('np2','Ulangi password baru','new-password')}
    <div id="rserr" class="err" role="alert"></div><button class="btn block" id="rsbtn" style="margin-top:6px">Simpan password</button>`);
  bindPw();
  const go = async ()=>{
    const a = document.getElementById('np').value, b = document.getElementById('np2').value, er = document.getElementById('rserr'), btn = document.getElementById('rsbtn');
    if(a.length < 6){ er.textContent = 'Password minimal 6 karakter.'; return; }
    if(a !== b){ er.textContent = 'Kedua password belum sama.'; return; }
    btn.disabled = true; btn.textContent = 'Menyimpan...'; er.textContent = '';
    try{ await auth.confirmPasswordReset(RESET.code, a); RESET.code = ''; }
    catch(x){ const c = String((x && x.code) || ''); if(c.includes('expired') || c.includes('invalid-action')){ dead(); return; } er.textContent = authErr(x); btn.disabled = false; btn.textContent = 'Simpan password'; return; }
    card(`<h1>Password berhasil diubah</h1><p class="sub">Silakan masuk dengan password baru kamu.</p><button class="btn block" id="rsGo">Masuk ke toko</button>`);
    document.getElementById('rsGo').onclick = ()=>toStore('#/login');
  };
  document.getElementById('rsbtn').onclick = go;
  ['np','np2'].forEach(id=>document.getElementById(id).onkeydown = e=>{ if(e.key==='Enter') go(); });
}
async function bootReset(){
  document.body.classList.add('reset-mode');
  try{
    if(typeof firebase==='undefined' || !RESET.apiKey) throw new Error('sdk/key');
    const a = firebase.apps.length ? firebase.app() : firebase.initializeApp({ apiKey:RESET.apiKey, authDomain:location.hostname });
    auth = a.auth(); auth.languageCode = 'id';
  }catch(e){ console.error('reset init', e); auth = null; }
  document.title = 'Buat password baru';
  viewReset();
}
async function boot(){
  saveCart();
  if(RESET) return bootReset();
  if(!DB){ app.innerHTML = `<div class="empty"><h3>Toko belum terhubung</h3><p>Isi <code>DB_URL</code> di file toko.html, atau buka toko lewat link dari admin.</p></div>`; return; }
  app.innerHTML = `<div class="skel" style="aspect-ratio:12/5;margin-top:16px"></div><div class="grid" style="margin-top:20px">${'<div class="skel" style="aspect-ratio:3/4"></div>'.repeat(4)}</div>`;
  try{ CAT = await api('pos/catalog'); }catch(e){ CAT = null; }
  if(!CAT){ app.innerHTML = `<div class="empty"><h3>Katalog belum tersedia</h3><p>Toko sedang disiapkan. Coba beberapa saat lagi.</p><button class="btn" onclick="boot()">Coba lagi</button></div>`; return; }
  prepCatalog(); catLoadedAt = Date.now();
  document.title = CAT.store.name || 'Toko Aksesoris Mobil';
  document.getElementById('storeName').textContent = CAT.store.name || 'Toko Aksesoris Mobil';
  if(CAT.store.logo){ const l = document.getElementById('logo'); l.dataset.img = CAT.store.logo; hydrate(document.querySelector('.top')); }
  initAuth();
  if(auth) await new Promise(r=>{ const off = auth.onAuthStateChanged(()=>{ off(); r(); }); setTimeout(r, 4000); });
  booted = true;
  route();
}
boot();


/* Ruang bawah otomatis: konten tidak pernah tertutup menu bawah / bar harga */
(function(){
  let raf = 0;
  function measure(){
    raf = 0;
    let h = 0;
    document.querySelectorAll('.bnav, .buybar, .checkout-bar, .sticky-bottom').forEach(el=>{
      const cs = getComputedStyle(el);
      if(cs.display==='none' || cs.visibility==='hidden' || cs.position!=='fixed') return;
      const r = el.getBoundingClientRect();
      if(r.height && r.bottom >= window.innerHeight - 2) h = Math.max(h, r.height);
    });
    const space = Math.max(40, Math.ceil(h) + 28);
    document.documentElement.style.setProperty('--bottom-space', space + 'px');
  }
  function schedule(){ if(!raf) raf = requestAnimationFrame(measure); }
  window.addEventListener('resize', schedule);
  window.addEventListener('hashchange', ()=>setTimeout(schedule, 0));
  new MutationObserver(schedule).observe(document.body, { childList:true, subtree:true, attributes:true, attributeFilter:['class','style'] });
  if(window.ResizeObserver){ const ro = new ResizeObserver(schedule); document.querySelectorAll('.bnav').forEach(el=>ro.observe(el)); }
  schedule();
})();
</script>
